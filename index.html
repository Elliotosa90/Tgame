<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Runner — Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,sans-serif; }
  body { background:#0f1220; color:#eef; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { width:100%; display:flex; justify-content:space-between; align-items:center; padding:14px 18px; background:#171b2e; }
  .coins { background:#2a2f4a; padding:6px 14px; border-radius:20px; font-weight:bold; color:#ffd76a; }
  main { width:100%; max-width:480px; padding:20px; flex:1; }
  .card { background:#1a1f36; border-radius:14px; padding:18px; margin-bottom:14px; }
  h2 { margin-bottom:10px; font-size:18px; }
  .level { display:flex; justify-content:space-between; align-items:center; padding:10px; border-radius:10px; margin-bottom:8px; background:#232849; }
  .level.locked { opacity:.55; }
  .level button, .btn { background:#ffd76a; border:none; padding:8px 16px; border-radius:8px; font-weight:bold; cursor:pointer; }
  .btn-buy { width:100%; padding:12px; border-radius:10px; font-size:15px; margin-top:6px; background:#7b5cff; color:#fff; }
  canvas { width:100%; background:#000; border-radius:10px; display:block; touch-action:none; }
  .hud { display:flex; justify-content:space-between; padding:8px 4px; font-size:14px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#2ecc71; color:#fff; padding:10px 20px; border-radius:8px; opacity:0; transition:.3s; z-index:9; }
  .toast.show { opacity:1; }
  #status { font-size:12px; color:#7f8; }
</style>
</head>
<body>
<header>
  <strong>⭐ Star Runner</strong>
  <div><span id="status">● connecting…</span> &nbsp; <span class="coins">🪙 <span id="coinCount">0</span></span></div>
</header>
<main>
  <div id="menu">
    <div class="card">
      <h2>Level Select</h2>
      <div id="levels"></div>
    </div>
    <div class="card">
      <h2>Buy Coins (Telegram Stars)</h2>
      <div id="shop"></div>
    </div>
  </div>
  <div id="gameScreen" style="display:none">
    <div class="card">
      <div class="hud">
        <span id="hudLevel">Level 1</span>
        <span>Score: <span id="hudScore">0</span></span>
        <span>❤️ <span id="hudLives">3</span></span>
      </div>
      <canvas id="cv" width="440" height="500"></canvas>
      <p style="font-size:12px;color:#89f;margin-top:6px">Tap/hold left & right side to dodge ⬢, collect 🟡. Score 10 to win!</p>
      <button class="btn" style="margin-top:10px" onclick="exitGame()">← Menu</button>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script type="module">
const tg = window.Telegram?.WebApp;
tg?.ready();

// ================= FIREBASE =================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDs1bLIc1sB7zKNME901XHKCRDJdEgApdE",
  authDomain: "telestars-7f2ab.firebaseapp.com",
  databaseURL: "https://telestars-7f2ab-default-rtdb.firebaseio.com",
  projectId: "telestars-7f2ab",
  storageBucket: "telestars-7f2ab.firebasestorage.app",
  messagingSenderId: "804548585859",
  appId: "1:804548585859:web:709f43d52fe42dedc72eb6"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Telegram user identity
const user = tg?.initDataUnsafe?.user;
const uid = user ? String(user.id) : 'guest';
document.getElementById('status').textContent = user ? `👤 ${user.first_name}` : '⚠ not in Telegram';

let player = { coins: 0, level: 1 };
let config = { levels: 10, passCost: 50, packages: [] };

// REAL-TIME: player data syncs instantly (coins update the moment payment lands)
onSnapshot(doc(db, 'players', uid), snap => {
  if (snap.exists()) {
    player = snap.data();
  } else {
    player = { coins: 0, level: 1, name: user?.first_name || 'Guest', createdAt: serverTimestamp() };
    setDoc(doc(db, 'players', uid), player);
  }
  document.getElementById('coinCount').textContent = player.coins;
  renderLevels();
});

// REAL-TIME: admin price/level changes propagate live to all players
onSnapshot(doc(db, 'config', 'game'), snap => {
  if (snap.exists()) config = snap.data();
  renderLevels(); renderShop();
});

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function savePlayer() { await setDoc(doc(db, 'players', uid), player, { merge: true }); }

// ================= RENDER =================
function renderLevels() {
  const lv = document.getElementById('levels');
  lv.innerHTML = '';
  for (let i = 1; i <= (config.levels || 10); i++) {
    const unlocked = i <= player.level;
    const div = document.createElement('div');
    div.className = 'level' + (unlocked ? '' : ' locked');
    div.innerHTML = `<span>Level ${i}</span>`;
    if (unlocked) div.innerHTML += `<button onclick="startGame(${i})">Play</button>`;
    else if (i === player.level + 1) div.innerHTML += `<button onclick="buyLevel()">Pass — ${config.passCost} 🪙</button>`;
    else div.innerHTML += `<span>🔒</span>`;
    lv.appendChild(div);
  }
}
function renderShop() {
  const shop = document.getElementById('shop');
  shop.innerHTML = '';
  (config.packages || []).forEach(pkg => {
    const b = document.createElement('button');
    b.className = 'btn btn-buy';
    b.textContent = `${pkg.label}: ${pkg.coins} 🪙 — ⭐ ${pkg.stars}`;
    b.onclick = () => buyCoins(pkg);
    shop.appendChild(b);
  });
}
window.startGame = startGame; window.exitGame = exitGame; window.buyLevel = buyLevel;

// ================= LEVEL PASS =================
async function buyLevel() {
  if (player.coins >= config.passCost) {
    player.coins -= config.passCost;
    player.level++;
    await savePlayer();
    toast(`Level ${player.level} unlocked!`);
  } else toast('Not enough coins — buy more below!');
}

// ================= LIVE STARS PAYMENT =================
// Your backend (Part 3) creates the invoice via the Bot API.
const API_BASE = 'https://tgamebackend.onrender.com';  // <<< REPLACE with your backend URL

async function buyCoins(pkg) {
  if (!user) { toast('Open this inside Telegram to pay with Stars'); return; }
  try {
    toast('Creating invoice…');
    const res = await fetch(API_BASE + '/api/create-invoice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        packId: pkg.id,
        userId: user.id,
        // Send Telegram's initData so the backend can verify the request is genuine
        initData: tg?.initData || ''
      })
    });
    const data = await res.json();
    if (!data.invoiceLink) throw new Error(data.error || 'No invoice link');

    tg.openInvoice(data.invoiceLink, async (status) => {
      if (status === 'paid') {
        // Backend webhook already credited Firebase; real-time snapshot updates the UI.
        toast('Payment received! ⭐');
      } else if (status === 'failed') toast('Payment failed');
      else if (status === 'cancelled') toast('Payment cancelled');
    });
  } catch (e) {
    toast('Error: ' + e.message);
  }
}

// ================= GAME (unchanged dodger) =================
let G = null;
function startGame(level) {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  G = { level, ctx, cv,
    player: { x: cv.width/2 - 20, y: cv.height - 60, w: 40, h: 40, speed: 6 },
    items: [], score: 0, lives: 3, target: 10, keys: {}, running: true, raf: null };
  document.getElementById('hudLevel').textContent = 'Level ' + level;
  updateHud();
  const kd = e => G.keys[e.key] = true, ku = e => G.keys[e.key] = false;
  document.addEventListener('keydown', kd); document.addEventListener('keyup', ku);
  G.cleanupKeys = () => { document.removeEventListener('keydown', kd); document.removeEventListener('keyup', ku); };
  const ts = e => { const r = cv.getBoundingClientRect(); G.keys[(e.touches[0].clientX - r.left)/r.width < .5 ? 'ArrowLeft':'ArrowRight'] = true; };
  const te = () => G.keys = {};
  cv.addEventListener('touchstart', ts); cv.addEventListener('touchend', te);
  G.cleanupTouch = () => { cv.removeEventListener('touchstart', ts); cv.removeEventListener('touchend', te); };
  loop();
}
function exitGame() {
  if (G) { G.running = false; cancelAnimationFrame(G.raf); G.cleanupKeys?.(); G.cleanupTouch?.(); G = null; }
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('menu').style.display = 'block';
}
function updateHud() {
  document.getElementById('hudScore').textContent = G.score;
  document.getElementById('hudLives').textContent = G.lives;
}
function loop() {
  if (!G || !G.running) return;
  const { ctx, cv, player: pl } = G;
  const speed = 3 + G.level * 0.5, spawnRate = 30 - Math.min(G.level * 2, 15);
  if (G.keys['ArrowLeft'] || G.keys['a']) pl.x -= pl.speed;
  if (G.keys['ArrowRight'] || G.keys['d']) pl.x += pl.speed;
  pl.x = Math.max(0, Math.min(cv.width - pl.w, pl.x));
  if (Math.random() < 1/spawnRate)
    G.items.push({ x: Math.random()*(cv.width-24), y: -24, w: 24, h: 24, coin: Math.random() < .35 });
  for (let i = G.items.length - 1; i >= 0; i--) {
    const it = G.items[i]; it.y += speed;
    if (it.x < pl.x + pl.w && it.x + it.w > pl.x && it.y < pl.y + pl.h && it.y + it.h > pl.y) {
      G.items.splice(i, 1);
      if (it.coin) { G.score++; updateHud(); if (G.score >= G.target) return winGame(); }
      else { G.lives--; updateHud(); if (G.lives <= 0) return loseGame(); }
      continue;
    }
    if (it.y > cv.height) G.items.splice(i, 1);
  }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#4fd2ff'; ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
  for (const it of G.items) {
    if (it.coin) { ctx.fillStyle = '#ffd76a'; ctx.beginPath(); ctx.arc(it.x+12, it.y+12, 12, 0, 7); ctx.fill(); }
    else { ctx.fillStyle = '#e74c3c'; ctx.fillRect(it.x, it.y, it.w, it.h); }
  }
  G.raf = requestAnimationFrame(loop);
}
async function winGame() {
  G.running = false; cancelAnimationFrame(G.raf); G.cleanupKeys?.(); G.cleanupTouch?.();
  if (G.level === player.level) { player.level++; toast('Level complete! Next level unlocked!'); }
  player.coins += 5 + G.level;
  await savePlayer();
  G = null;
  setTimeout(exitGame, 1200);
}
async function loseGame() {
  G.running = false; cancelAnimationFrame(G.raf); G.cleanupKeys?.(); G.cleanupTouch?.();
  toast('Game over! Restarting…');
  const lvl = G.level; G = null;
  setTimeout(() => startGame(lvl), 1000);
}
</script>
</body>
</html>
